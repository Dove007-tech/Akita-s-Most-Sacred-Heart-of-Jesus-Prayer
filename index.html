<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Heart of Jesus Prayer Printout</title>
    <style>
        body { 
            font-family: "Georgia", serif; 
            background-color: #FFFFFF; 
            color: #0D47A1; 
            margin: 0; 
            padding: 20px 10px; 
            text-align: center; 
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact;
        }
        .print-page { 
            max-width: 600px; 
            margin: 0 auto; 
            border: 4px double #90CAF9; 
            border-radius: 24px; 
            padding: 25px; 
            background: #FFFFFF;
            box-sizing: border-box;
        }
        .title { 
            font-size: 24px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin: 0 0 5px 0; 
            color: #0D47A1;
        }
        .subtitle {
            font-size: 13px;
            font-family: sans-serif;
            font-weight: bold;
            color: #1565C0;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* 🐑 Sheep Box Layout */
        .sheep-name-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .name-label {
            font-size: 13px;
            font-family: sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #1565C0;
        }
        .sheep-box {
            width: 250px;
            height: 75px;
            background: #FFFFFF;
            border: 3px dashed #90CAF9;
            border-radius: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sheep-box::before {
            content: "🐑";
            position: absolute;
            left: -15px;
            top: 15px;
            font-size: 34px;
        }
        .write-here-text {
            font-size: 12px;
            color: #90CAF9;
            font-style: italic;
            font-family: sans-serif;
        }

        /* ❤️ Middle Section: Sacred Heart Frame Layout (Using Inline SVG to Prevent Broken Text Truncation) */
        .prayer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }
        .svg-heart-frame {
            width: 100%;
            max-width: 500px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(183, 28, 28, 0.15));
        }

        /* 🗓️ Bottom Section: Plain Heart Tracker Grid (Using SVGs for perfect sizing) */
        .tracker-section {
            border-top: 1px dashed #90CAF9;
            padding-top: 20px;
        }
        .tracker-title {
            font-size: 13px;
            font-family: sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #1565C0;
        }
        .hearts-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .svg-mini-heart {
            width: 40px;
            height: 40px;
        }

        .no-print-zone { margin-top: 25px; }
        .print-btn { background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%); color: #FFFFFF; border: 3px solid #FFFFFF; padding: 12px 30px; border-radius: 30px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-family: sans-serif; }
        
        @media print {
            body { padding: 0; background: #FFFFFF; }
            .print-page { border: none; padding: 10px; }
            .no-print-zone { display: none; }
        }
    </style>
</head>
<body>

    <div class="print-page">
        <h1 class="title">My Prayer Covenant</h1>
        <div class="subtitle">Weekly Devotional Tracker</div>

        <div class="sheep-name-section">
            <div class="name-label">Little Lamb Name:</div>
            <div class="sheep-box">
                <span class="write-here-text">(Write your name here)</span>
            </div>
        </div>

        <!-- 🌟 Sacred Heart SVG Viewport Frame Container -->
        <div class="prayer-container">
            <svg class="svg-heart-frame" viewBox="0 0 500 480" xmlns="http://w3.org">
                <!-- 👑 Holy Thorns and Cross Crown Elements -->
                <text x="250" y="55" font-size="34" text-anchor="middle">🔥</text>
                <text x="250" y="30" font-size="28" text-anchor="middle">✝️</text>
                
                <!-- ❤️ Flawless Sacred Devotional Heart Curve Geometry Path -->
                <path d="M250,450 C250,450 40,290 40,170 C40,90 110,60 190,100 C220,120 250,150 250,150 C250,150 280,120 310,100 C390,60 460,90 460,170 C460,290 250,450 250,450 Z" 
                      fill="#FFF5F5" stroke="#FF8A80" stroke-width="4"/>

                <!-- 📜 Multi-line Auto-wrapped Prayer Text Content Block Grid Matrix -->
                <g font-family="Georgia, serif" font-size="12.5" font-weight="500" fill="#212121" text-anchor="middle">
                    <text x="250" y="150" font-size="15" font-weight="900" fill="#B71C1C">SACRED HEART OF JESUS</text>
                    
                    <text x="250" y="175">Most Sacred Heart of Jesus, truly present in the Holy</text>
                    <text x="250" y="195">Eucharist, I consecrate my body and soul to be entirely</text>
                    <text x="250" y="215">one with Your heart, being sacrificed at every instant</text>
                    <text x="250" y="235">on all the altars of the world and giving praise to</text>
                    <text x="250" y="255">the Father pleading for the coming of His Kingdom.</text>
                    
                    <text x="250" y="285">Please receive this humble offering of myself. Use me</text>
                    <text x="250" y="305">as You will for the glory of the Father and salvation of</text>
                    <text x="250" y="325">souls. Most Holy Mother of God, never let me be</text>
                    <text x="250" y="345">separated from Your Divine Son. Please defend and</text>
                    <text x="250" y="365">protect me as Your special child. Amen.</text>
                    
                    <text x="250" y="400" font-size="11" font-weight="bold" fill="#757575">(By Sr. Agnes Sasagawa - Akita)</text>
                </g>
            </svg>
        </div>

        <div class="tracker-section">
            <div class="tracker-title">My Weekly Recitation Tracker (Color a heart each time you pray!)</div>
            <div class="hearts-row">
                <!-- 7 Sharp SVG Hearts Matrix Layout -->
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
                <svg class="svg-mini-heart" viewBox="0 0 32 32"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,3 11,6 C13,7 16,10 16,10 C16,10 19,7 21,6 C26,3 30,5 30,10 C30,18 16,28 16,28 Z" fill="#FFFFFF" stroke="#FF8A80" stroke-width="2"/></svg>
            </div>
        </div>
    </div>

    <div class="no-print-zone">
        <button class="print-btn" onclick="window.print()">Print Prayer Page 🖨️</button>
    </div>

</body>
</html>
